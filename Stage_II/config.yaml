seed: 42
device: cuda
output_dir: results
experiment_name: sam_lora

data:
  dataset_root: ../Stage_III/dataset
  split_file: split.json
  image_size: 1024
  num_workers: 4
  mask_format: npy
  mask_suffixes: [disc]
  use_only_labeled: false

model:
  model_type: vit_b
  checkpoint_path: checkpoints/sam_vit_b_01ec64.pth
  freeze_image_encoder: false
  freeze_prompt_encoder: true
  freeze_mask_decoder: false
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.1
  lora_target_modules: [qkv, proj]

training:
  batch_size: 2
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  mixed_precision: true
  optimizer: adamw
  betas: [0.9, 0.999]
  scheduler: cosine
  focal_loss_weight: 20.0
  dice_loss_weight: 1.0
  iou_loss_weight: 1.0
  patience: 15
  min_delta: 0.001
  save_every: 5
  keep_last_n: 3

evaluation:
  split: test
  threshold: 0.5
  batch_size: 1
  confidence: 0.95
